name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # pgvector'lü Postgres — migration ve (ileride) entegrasyon testleri için.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass123
          POSTGRES_DB: careerdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d careerdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://raguser:ragpass123@localhost:5432/careerdb
      GEMINI_API_KEY: test-key-not-used
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests alembic

      - name: Migration'ları uygula (şema doğrulaması)
        run: alembic upgrade head

      - name: Testler (+ coverage)
        run: pytest --cov --cov-report=term-missing
