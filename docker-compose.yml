# Lokal/geliştirme ortamı: uygulama + pgvector'lü PostgreSQL.
# Çalıştırmak için: `docker compose up --build`
# Not: gerçek sırlar `.env` dosyasından okunur (repoya girmez).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass123}
      POSTGRES_DB: ${POSTGRES_DB:-careerdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # DB gerçekten hazır olmadan app başlamasın.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-careerdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Compose ağı içinde DB host adı 'db'.
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass123}@db:5432/${POSTGRES_DB:-careerdb}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY gerekli}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_JSON: ${LOG_JSON:-false}
      # Frontend aynı origin'den (nginx /api proxy) konuştuğu için CORS
      # docker'da gerekmez; yine de dev için açık bırakılır.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "9000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (nginx ile statik servis + /api reverse proxy).
  # Not: frontend ayrı bir repodadır; iki repo kardeş klasörlerde olmalı
  # (career-copilot/ ve career-copilot-frontend/).
  frontend:
    build:
      context: ../career-copilot-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
